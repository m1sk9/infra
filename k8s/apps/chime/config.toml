# chime configuration
# https://github.com/m1sk9/chime/blob/main/README.md#configuration
# https://github.com/m1sk9/chime/blob/main/config/config.toml.example

[system]
log_level = "info"
tick_interval_sec = 30
timezone = "Asia/Tokyo"

## Status ----
## 現状対応しているのは Atlassian Statuspage v2 のみです ( /api/v2/incidents.json を使うタイプ)

[[status_pages]]
  name = "github"
  url = "https://www.githubstatus.com"
  webhook = "dev-status"
  display_name = "GitHub Status"
  avatar_url = "https://github.com/community.png"

[[status_pages]]
  name = "proton"
  url = "https://status.proton.me"
  webhook = "dev-status"
  display_name = "Proton Status"
  avatar_url = "https://github.com/ProtonMail.png"

[[status_pages]]
  name = "claude"
  url = "https://status.claude.com"
  webhook = "dev-status"
  display_name = "Claude Status"
  avatar_url = "https://github.com/claude.png"

[[status_pages]]
  name = "The Rust Programming Language"
  url = "https://status.crates.io"
  webhook = "dev-status"
  display_name = "The Rust Programming Language Status"
  avatar_url = "https://github.com/rust-lang.png"

[[status_pages]]
  name = "Tailscale"
  url = "https://status.tailscale.com"
  webhook = "dev-status"
  display_name = "Tailscale Status"
  avatar_url = "https://github.com/tailscale.png"

## Browser releases ----

[[watches]]
  name = "firefox"
  webhook = "www"
  source = { kind = "firefox", channel = "release" }
  display_name = "Firefox Releases"
  avatar_url = "https://github.com/mozilla.png"

[[watches]]
  name = "chrome"
  webhook = "www"
  source = { kind = "chrome", platform = "win", channel = "stable", rollout = "started" }
  display_name = "Chrome Releases"
  avatar_url = "https://github.com/GoogleChrome.png"

