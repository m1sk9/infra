apiVersion: apps/v1
kind: Deployment
metadata:
  name: chime
spec:
  replicas: 1
  # Recreate, never a rolling update: two instances logged in with the same
  # Discord token answer every message twice.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: chime
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chime
      annotations:
        # Config is mounted with subPath, which does not follow ConfigMap updates,
        # so a change has to roll the Pod.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      # Fixed to s1, not preferred: if s1 is cut off but alive, a Pod rescheduled
      # to s2 would run beside the old one.
      nodeSelector:
        m1sk9.dev/pool: apps
      containers:
        - name: app
          image: ghcr.io/m1sk9/chime:v0.7.0
          envFrom:
            - secretRef:
                name: chime-env
          env:
            - name: CHIME_CONFIG
              value: "/etc/chime/config.toml"
          livenessProbe:
            exec:
              command: ["/usr/local/bin/chime", "health"]
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command: ["/usr/local/bin/chime", "health"]
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/chime/config.toml
              subPath: config.toml
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: chime-config
