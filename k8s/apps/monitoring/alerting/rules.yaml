apiVersion: 1
groups:
  - orgId: 1
    name: node
    folder: Alerts
    interval: 1m
    rules:
      - uid: bg146gshs1ekgf
        title: Node CPU high
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: (100 - avg by(instance)(rate(node_cpu_seconds_total{mode="idle",instance=~"s1|s2"}[5m])) * 100) > bool 90
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              settings: {mode: dropNN}
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0], type: gt}
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: CPU usage over 90% for 5m on {{ $labels.instance }}
        labels:
          notify: discord
          severity: warning
        isPaused: false
      - uid: ag146gsmkcef4a
        title: Node RAM high
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: ((1 - node_memory_MemAvailable_bytes{instance=~"s1|s2"} / node_memory_MemTotal_bytes{instance=~"s1|s2"}) * 100) > bool 90
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              settings: {mode: dropNN}
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0], type: gt}
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: RAM usage over 90% for 5m on {{ $labels.instance }}
        labels:
          notify: discord
          severity: warning
        isPaused: false
      - uid: bg146gsr55p8gd
        title: Node CPU temperature high
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: max by(instance)(node_hwmon_temp_celsius{chip="platform_coretemp_0",instance=~"s1|s2"}) >= bool 80
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              settings: {mode: dropNN}
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0], type: gt}
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: CPU temperature at or above 80C for 5m on {{ $labels.instance }}
        labels:
          notify: discord
          severity: warning
        isPaused: false
  - orgId: 1
    name: pythia
    folder: Alerts
    interval: 1m
    rules:
      - uid: eg146gsvdhibkc
        title: Pythia credits exhausted (HTTP 402)
        condition: C
        data:
          - refId: A
            queryType: instant
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: P8E80F9AEF21F6940
            model:
              expr: sum(count_over_time({namespace="pythia"} | json | fields_message="turn failed" | fields_status="402" [5m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              queryType: instant
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              settings: {mode: dropNN}
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0], type: gt}
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        annotations:
          summary: Pythia LLM request failed with HTTP 402 (insufficient OpenRouter credits)
        labels:
          notify: discord
          severity: critical
        isPaused: false
  - orgId: 1
    name: chime
    folder: chime
    interval: 1m
    rules:
      - uid: chime-poll-failing
        title: chime keeps failing to poll
        condition: B
        data:
          - refId: A
            datasourceUid: P8E80F9AEF21F6940
            relativeTimeRange:
              from: 1800
              to: 0
            model:
              refId: A
              queryType: instant
              # A page is polled about every 6 minutes, so 4 failures in
              # 30 minutes is nearly every poll. A single failed poll is
              # routine and only delays that page to the next interval.
              expr: >-
                sum by (fields_status_page, fields_watch, fields_rss) (
                count_over_time({namespace="chime", container="app"} | json
                | fields_message =~ "failed to poll (status page|watch|rss feed)" [30m]))
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [3]
        # No failure logs means no series, which is the healthy state.
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: chime failed most polls of one source in the last 30 minutes.
          description: >-
            The source is in the fields_status_page, fields_watch or fields_rss
            label. Its notifications are not being delivered while this fires;
            check the chime logs for the error.
        labels:
          notify: discord
          severity: warning
  - orgId: 1
    name: workload
    folder: Alerts
    interval: 1m
    rules:
      - uid: workload-deploy-unavailable
        title: Deployment unavailable
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              expr: kube_deployment_spec_replicas - kube_deployment_status_replicas_available > 0
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              reducer: last
              refId: B
              settings: {mode: dropNN}
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0], type: gt}
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              refId: C
              type: threshold
        # The expression only returns series while the condition holds, so no data is healthy.
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} has unavailable replicas for 5m"
        labels:
          notify: discord
          severity: critical
        isPaused: false
      - uid: workload-sts-ds-unavailable
        title: StatefulSet or DaemonSet unavailable
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              expr: (kube_statefulset_replicas - kube_statefulset_status_replicas_ready > 0) or (kube_daemonset_status_number_unavailable > 0)
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              reducer: last
              refId: B
              settings: {mode: dropNN}
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0], type: gt}
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              refId: C
              type: threshold
        # The expression only returns series while the condition holds, so no data is healthy.
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "{{ $labels.namespace }}/{{ $labels.statefulset }}{{ $labels.daemonset }} has unavailable pods for 5m"
        labels:
          notify: discord
          severity: critical
        isPaused: false
      - uid: workload-restarting
        title: Container restarting repeatedly
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              expr: increase(kube_pod_container_status_restarts_total[15m]) >= 3
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              reducer: last
              refId: B
              settings: {mode: dropNN}
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0], type: gt}
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              refId: C
              type: threshold
        # The expression only returns series while the condition holds, so no data is healthy.
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} restarted 3 or more times in 15m"
        labels:
          notify: discord
          severity: warning
        isPaused: false
      - uid: workload-oomkilled
        title: Container OOMKilled
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              # last_terminated_reason keeps its value until the next termination, so it is only
              # trusted together with a restart in the window.
              expr: (increase(kube_pod_container_status_restarts_total[10m]) > 0) and on(namespace, pod, container) (kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1)
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              reducer: last
              refId: B
              settings: {mode: dropNN}
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0], type: gt}
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              refId: C
              type: threshold
        # The expression only returns series while the condition holds, so no data is healthy.
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "Container {{ $labels.namespace }}/{{ $labels.pod }}/{{ $labels.container }} was OOMKilled and restarted"
        labels:
          notify: discord
          severity: warning
        isPaused: false
      - uid: workload-pod-cannot-start
        title: Pod cannot start
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: prometheus
            model:
              expr: (kube_pod_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull|CreateContainerConfigError|InvalidImageName"} == 1) or (kube_pod_status_phase{phase=~"Pending|Failed|Unknown"} == 1)
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              reducer: last
              refId: B
              settings: {mode: dropNN}
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0], type: gt}
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              refId: C
              type: threshold
        # The expression only returns series while the condition holds, so no data is healthy.
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has not started for 10m"
        labels:
          notify: discord
          severity: warning
        isPaused: false
  - orgId: 1
    name: cluster
    folder: Alerts
    interval: 1m
    rules:
      - uid: cluster-node-not-ready
        title: Node NotReady
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              expr: 1 - kube_node_status_condition{condition="Ready",status="true"} > 0
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              reducer: last
              refId: B
              settings: {mode: dropNN}
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0], type: gt}
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              refId: C
              type: threshold
        # The expression only returns series while the condition holds, so no data is healthy.
        noDataState: OK
        execErrState: Error
        for: 3m
        annotations:
          summary: "Node {{ $labels.node }} has not been Ready for 3m"
        labels:
          notify: discord
          severity: critical
        isPaused: false
      - uid: cluster-target-down
        title: Scrape target down
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              expr: 1 - up{job=~"kubelet|node-exporter|kube-state-metrics|monitoring-prometheus|monitoring-grafana|coredns|apiserver"} > 0
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              reducer: last
              refId: B
              settings: {mode: dropNN}
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0], type: gt}
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              refId: C
              type: threshold
        # The expression only returns series while the condition holds, so no data is healthy.
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Prometheus target {{ $labels.job }} {{ $labels.instance }} has been down for 5m"
        labels:
          notify: discord
          severity: warning
        isPaused: false
  - orgId: 1
    name: capacity
    folder: Alerts
    interval: 1m
    rules:
      - uid: capacity-node-disk-low
        title: Node disk space low
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              # Written as a deficit (15 - free%) so that the value stays positive even at 0% free.
              expr: 15 - 100 * node_filesystem_avail_bytes{instance=~"s1|s2",mountpoint="/",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{instance=~"s1|s2",mountpoint="/",fstype!~"tmpfs|overlay"} > 0
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              reducer: last
              refId: B
              settings: {mode: dropNN}
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0], type: gt}
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              refId: C
              type: threshold
        # The expression only returns series while the condition holds, so no data is healthy.
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "Less than 15% of the root filesystem is free on {{ $labels.instance }}"
        labels:
          notify: discord
          severity: warning
        isPaused: false
      - uid: capacity-pvc-low
        title: PVC space low
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              # The apiserver job exposes the same series with a different namespace label.
              expr: 15 - 100 * kubelet_volume_stats_available_bytes{job="kubelet"} / kubelet_volume_stats_capacity_bytes{job="kubelet"} > 0
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              reducer: last
              refId: B
              settings: {mode: dropNN}
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0], type: gt}
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              refId: C
              type: threshold
        # The expression only returns series while the condition holds, so no data is healthy.
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "Less than 15% of PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} is free"
        labels:
          notify: discord
          severity: warning
        isPaused: false
  - orgId: 1
    name: logs
    folder: Alerts
    interval: 1m
    rules:
      - uid: logs-bot-error
        title: Bot logged an error
        condition: C
        data:
          - refId: A
            queryType: instant
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: P8E80F9AEF21F6940
            model:
              # Loki has no ERROR lines from the bots over the last 7 days, so any hit is new.
              expr: sum by (namespace) (count_over_time({namespace=~"babyrite|chime|honeypot|pythia"} | detected_level="error" !~ `"status":\s*"?402"?` [5m]))
              instant: true
              queryType: instant
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              reducer: last
              refId: B
              settings: {mode: dropNN}
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0], type: gt}
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              refId: C
              type: threshold
        # The expression only returns series while the condition holds, so no data is healthy.
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "{{ $labels.namespace }} logged ERROR lines in the last 5m"
          description: >-
            Check the logs of the namespace in the summary. HTTP 402 is excluded because the
            Pythia credits rule already covers it.
        labels:
          notify: discord
          severity: warning
        isPaused: false
