prometheus-blackbox-exporter:
  fullnameOverride: blackbox-exporter

  # The pod network (flannel) is IPv4 only, so IPv6 probes need the host's
  # stack. It also puts the probes on the same path as the hosts' own traffic.
  # ICMP needs no NET_RAW: the hosts' net.ipv4.ping_group_range covers every gid,
  # so the non-root exporter can use unprivileged ping sockets.
  hostNetwork: true

  # With hostNetwork the new pod cannot bind :9115 while the old one holds it,
  # so the old pod has to go first. Recreate would say that directly, but the
  # chart's rollingUpdate default cannot be removed from an umbrella chart and
  # the API server rejects the two together.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1

  nodeSelector:
    m1sk9.dev/pool: observability

  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

  # Every module pins one address family with no fallback; a probe that quietly
  # fell back to the other family would hide exactly the difference being
  # measured.
  config:
    modules:
      icmp_ip4:
        prober: icmp
        timeout: 5s
        icmp:
          preferred_ip_protocol: ip4
          ip_protocol_fallback: false
      icmp_ip6:
        prober: icmp
        timeout: 5s
        icmp:
          preferred_ip_protocol: ip6
          ip_protocol_fallback: false
      http_ip4:
        prober: http
        timeout: 10s
        http:
          preferred_ip_protocol: ip4
          ip_protocol_fallback: false
      http_ip6:
        prober: http
        timeout: 10s
        http:
          preferred_ip_protocol: ip6
          ip_protocol_fallback: false
      # Latency alone missed the 2026-11 slowdown, where RTT stayed low while
      # single flows stalled; the time to fetch 1 MB catches that.
      download_ip4:
        prober: http
        timeout: 25s
        http:
          preferred_ip_protocol: ip4
          ip_protocol_fallback: false
      download_ip6:
        prober: http
        timeout: 25s
        http:
          preferred_ip_protocol: ip6
          ip_protocol_fallback: false
      # A lost SYN shows up as a connect time of about 1 s (the first SYN
      # retransmit). In 2026-11 IPv4 connects stalled like this in the evening
      # while ping stayed flat, so connect time is measured on its own.
      tcp_ip4:
        prober: tcp
        timeout: 5s
        tcp:
          preferred_ip_protocol: ip4
          ip_protocol_fallback: false
      tcp_ip6:
        prober: tcp
        timeout: 5s
        tcp:
          preferred_ip_protocol: ip6
          ip_protocol_fallback: false

  serviceMonitor:
    enabled: true
    defaults:
      interval: 30s
      scrapeTimeout: 10s
    targets:
      # The home gateway (NTT HGW). If it slows down along with everything
      # beyond it, the gateway is the bottleneck rather than the ISP.
      - name: hgw-v4
        url: 192.168.1.1
        module: icmp_ip4
        additionalMetricsRelabels: {family: ipv4, check: icmp}
      - name: cloudflare-dns-v4
        url: 1.1.1.1
        module: icmp_ip4
        additionalMetricsRelabels: {family: ipv4, check: icmp}
      - name: cloudflare-dns-v6
        url: 2606:4700:4700::1111
        module: icmp_ip6
        additionalMetricsRelabels: {family: ipv6, check: icmp}
      - name: google-dns-v4
        url: 8.8.8.8
        module: icmp_ip4
        additionalMetricsRelabels: {family: ipv4, check: icmp}
      - name: google-dns-v6
        url: 2001:4860:4860::8888
        module: icmp_ip6
        additionalMetricsRelabels: {family: ipv6, check: icmp}
      - name: cloudflare-trace-v4
        url: https://www.cloudflare.com/cdn-cgi/trace
        module: http_ip4
        interval: 1m
        scrapeTimeout: 15s
        additionalMetricsRelabels: {family: ipv4, check: http}
      - name: cloudflare-trace-v6
        url: https://www.cloudflare.com/cdn-cgi/trace
        module: http_ip6
        interval: 1m
        scrapeTimeout: 15s
        additionalMetricsRelabels: {family: ipv6, check: http}
      - name: cloudflare-download-v4
        url: https://speed.cloudflare.com/__down?bytes=1000000
        module: download_ip4
        interval: 5m
        scrapeTimeout: 30s
        additionalMetricsRelabels: {family: ipv4, check: download}
      - name: cloudflare-download-v6
        url: https://speed.cloudflare.com/__down?bytes=1000000
        module: download_ip6
        interval: 5m
        scrapeTimeout: 30s
        additionalMetricsRelabels: {family: ipv6, check: download}
      # The chart writes url into YAML unquoted, so a bracketed IPv6 address
      # carries its own quotes or it parses as a flow sequence.
      # 15 s, since a stall hitting a few percent of connects would otherwise
      # appear only a handful of times an hour.
      - name: tcp-cloudflare-v4
        url: 1.1.1.1:443
        module: tcp_ip4
        interval: 15s
        additionalMetricsRelabels: {family: ipv4, check: tcp}
      - name: tcp-cloudflare-v6
        url: "'[2606:4700:4700::1111]:443'"
        module: tcp_ip6
        interval: 15s
        additionalMetricsRelabels: {family: ipv6, check: tcp}
      - name: tcp-google-v4
        url: 8.8.8.8:443
        module: tcp_ip4
        interval: 15s
        additionalMetricsRelabels: {family: ipv4, check: tcp}
      - name: tcp-google-v6
        url: "'[2001:4860:4860::8888]:443'"
        module: tcp_ip6
        interval: 15s
        additionalMetricsRelabels: {family: ipv6, check: tcp}
      # NTT East's resolvers inside NGN, reached before traffic is handed to
      # the VNE (JPIX). Slow connects here as well as to the public resolvers
      # place the evening congestion in NGN; slow connects only beyond them
      # place it at or past the NGN-VNE interconnect. They drop ICMP, so they
      # are probed on TCP 53 instead.
      - name: tcp-ngn-dns-a-v6
        url: "'[2404:1a8:7f01:a::3]:53'"
        module: tcp_ip6
        interval: 15s
        additionalMetricsRelabels: {family: ipv6, check: tcp}
      - name: tcp-ngn-dns-b-v6
        url: "'[2404:1a8:7f01:b::3]:53'"
        module: tcp_ip6
        interval: 15s
        additionalMetricsRelabels: {family: ipv6, check: tcp}
      # pixiv's image server has no AAAA record, so it always goes through MAP-E.
      - name: tcp-pximg-v4
        url: i.pximg.net:443
        module: tcp_ip4
        interval: 15s
        additionalMetricsRelabels: {family: ipv4, check: tcp}
      # Game servers go to the Game Servers dashboard, kept apart from the
      # line-quality targets by `group: game`. This is the FFXIV server the
      # client keeps its only connection to (port 54992) on the Gaia data
      # centre, and it stays the same across data centre travel and duties.
      # VALORANT is absent: its match servers change every match, sit in
      # different Riot networks, and answer neither ICMP nor TCP.
      - name: ffxiv-gaia-v4
        url: 119.252.37.23
        module: icmp_ip4
        additionalMetricsRelabels: {family: ipv4, check: icmp, group: game}
      - name: tcp-ffxiv-gaia-v4
        url: 119.252.37.23:54992
        module: tcp_ip4
        interval: 15s
        additionalMetricsRelabels: {family: ipv4, check: tcp, group: game}
