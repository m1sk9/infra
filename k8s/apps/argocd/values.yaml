argo-cd:
  global:
    # s2 is the only k3s server and k3s labels it control-plane itself.
    # Pinning by that label rather than a custom one keeps ArgoCD off s1, whose OS is reinstalled.
    nodeSelector:
      node-role.kubernetes.io/control-plane: "true"
  dex:
    enabled: false
  controller:
    # Only the application controller exports argocd_app_info, which the sync and
    # health alerts use; the other components' metrics have no consumer yet.
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
  configs:
    params:
      # TLS ends at Cloudflare; the tunnel reaches the server over plain HTTP inside the cluster.
      server.insecure: true
    cm:
      url: https://argocd.m1sk9.dev
      oidc.config: |
        name: Cloudflare Access
        issuer: https://m1sk9.cloudflareaccess.com/cdn-cgi/access/sso/oidc/3454b50d37efff3759248392c9dc26080948ef0a30fb15884daba5cacddef249
        clientID: 3454b50d37efff3759248392c9dc26080948ef0a30fb15884daba5cacddef249
        clientSecret: $argocd-oidc:clientSecret
        requestedScopes: ["openid", "email", "profile"]
    rbac:
      policy.default: ""
      policy.csv: |
        g, me@m1sk9.dev, role:admin
      scopes: "[email]"
