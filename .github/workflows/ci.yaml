name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  pull-requests: write

jobs:
  terraform-plan:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ./terraform
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Development Environment
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Lint
        run: tflint

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -lock-timeout=10m

  ansible-plan:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ./ansible
    env:
      ANSIBLE_HOST_KEY_CHECKING: "False"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Development Environment
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      - name: Write vault password
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass

      - name: Syntax check
        run: |
          ansible-playbook playbooks/site.yml --syntax-check
          ansible-playbook playbooks/backup.yml --syntax-check
          ansible-playbook playbooks/monitoring.yml --syntax-check
          ansible-playbook playbooks/k8s-agent.yml --syntax-check
          ansible-playbook playbooks/k8s.yml --syntax-check

      - name: Connect to Tailscale
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          use-cache: "true"

      - name: Plan (check + diff)
        run: |
          ansible-playbook playbooks/backup.yml --check --diff
          ansible-playbook playbooks/monitoring.yml --check --diff

      - name: Cleanup
        if: always()
        run: rm -f .vault_pass

  tailscale-acl-test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render policy file
        run: envsubst '${NEXTDNS_PROFILE_ID}' < tailscale/policy.hujson > tailscale/policy.rendered.hujson
        env:
          NEXTDNS_PROFILE_ID: ${{ secrets.NEXTDNS_PROFILE_ID }}

      - name: Test ACL
        uses: tailscale/gitops-acl-action@5a4a17f5708e9bf96f4ee915a95e9f83c2eebe1a # v1.5.2
        with:
          # A read-only client (policy_file:read): PR workflows run for every same-repo
          # branch, including Renovate's, so they must not hold the write credential.
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID_ACL_READ }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET_ACL_READ }}
          tailnet: ${{ secrets.TS_TAILNET }}
          action: test
          policy-file: ./tailscale/policy.rendered.hujson

  helm:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ./k8s/apps
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Development Environment
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      - name: Helm Dependency Update
        run: |
          for chart in */; do
            helm dependency update "$chart"
          done

      - name: Helm Lint
        run: |
          for chart in */; do
            helm lint "$chart"
          done

      - name: Helm Template
        run: |
          for chart in */; do
            helm template "${chart%/}" "$chart" --namespace "${chart%/}" > /dev/null
          done
