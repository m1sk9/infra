name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  pull-requests: write

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  terraform-apply:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ./terraform
    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_TOKEN_APP_TERRAFORM_IO }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Development Environment
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -input=false -lock-timeout=10m

      - name: Terraform Apply
        run: terraform apply -input=false -no-color -auto-approve -lock-timeout=10m

  ansible-deploy:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: ./ansible
    env:
      ANSIBLE_HOST_KEY_CHECKING: "False"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Development Environment
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3

      - name: Connect to Tailscale
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          use-cache: "true"

      - name: Write vault password
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass

      - name: Deploy backup
        run: ansible-playbook playbooks/backup.yml

      - name: Deploy monitoring
        run: ansible-playbook playbooks/monitoring.yml

      - name: Cleanup
        if: always()
        run: rm -f .vault_pass

  tailscale-acl-apply:
    runs-on: ubuntu-26.04
    # The write credential lives only in this environment, which admits main alone,
    # so no other branch or PR workflow can rewrite the tailnet policy.
    environment: tailscale-acl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Render policy file
        run: envsubst '${NEXTDNS_PROFILE_ID}' < tailscale/policy.hujson > tailscale/policy.rendered.hujson
        env:
          NEXTDNS_PROFILE_ID: ${{ secrets.NEXTDNS_PROFILE_ID }}

      - name: Apply ACL
        uses: tailscale/gitops-acl-action@5a4a17f5708e9bf96f4ee915a95e9f83c2eebe1a # v1.5.2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID_ACL }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET_ACL }}
          tailnet: ${{ secrets.TS_TAILNET }}
          action: apply
          policy-file: ./tailscale/policy.rendered.hujson
