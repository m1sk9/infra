---
# The release binary is fetched against its published checksum instead of piping
# get.k3s.io into a shell: the version stays pinned and nothing runs before it
# has been verified.
- name: "k3s agent | Check installed version"
  ansible.builtin.command: /usr/local/bin/k3s --version
  register: k3s_agent_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: "k3s agent | Install binary ({{ k3s_version }})"
  ansible.builtin.get_url:
    url: "{{ k3s_url }}/k3s"
    dest: /usr/local/bin/k3s
    checksum: "sha256:{{ k3s_url }}/sha256sum-{{ k3s_arch }}.txt"
    mode: "0755"
    owner: root
    group: root
  when: k3s_version not in k3s_agent_installed.stdout
  notify: Restart k3s-agent

# Read from tailscale rather than written into the inventory: the address of s2
# changed once already and the stale value broke kubelet's node IP validation.
- name: "k3s agent | Read the Tailscale IPv4"
  ansible.builtin.command: tailscale ip -4
  register: k3s_agent_tailscale_ip
  changed_when: false
  check_mode: false

- name: "k3s agent | Set the node IP"
  ansible.builtin.set_fact:
    k3s_agent_node_ip: "{{ k3s_agent_tailscale_ip.stdout_lines | first }}"

- name: "k3s agent | Create config directory"
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: "k3s agent | Deploy join token"
  ansible.builtin.copy:
    content: "{{ k3s_token }}\n"
    dest: /etc/rancher/k3s/token
    mode: "0600"
    owner: root
    group: root
  no_log: true
  notify: Restart k3s-agent

- name: "k3s agent | Deploy config"
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
    owner: root
    group: root
  notify: Restart k3s-agent

- name: "k3s agent | Deploy systemd unit"
  ansible.builtin.template:
    src: k3s-agent.service.j2
    dest: /etc/systemd/system/k3s-agent.service
    mode: "0644"
    owner: root
    group: root
  notify: Restart k3s-agent

# The unit file is only rendered for real outside check mode, so starting it
# would fail on the absent unit during a plan.
- name: "k3s agent | Enable and start"
  ansible.builtin.systemd_service:
    name: k3s-agent
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode
