---
# restic release to install. Pinned so upgrades are reviewed; the version is
# tracked by a Renovate customManager (see .github/renovate.json).
restic_version: "0.19.1"
restic_arch: "amd64"
restic_install_path: /usr/local/bin/restic

# Files rendered onto the host.
restic_env_file: /etc/restic/infra-backup.env
restic_script_path: /usr/local/bin/infra-backup.sh
restic_failure_script_path: /usr/local/bin/infra-backup-failure.sh

# Better Stack heartbeat pinged on a successful run, and posted to with the
# journal tail on a failed one. Empty leaves both out, so the role still works
# without any monitoring configured. Set from group_vars.
backup_heartbeat_url: ""

# Scratch space for SQLite snapshots taken before handing them to restic.
restic_work_dir: /var/lib/infra-backup

# restic repository (Cloudflare R2, S3-compatible). Credentials come from the
# vault via the env file; only the non-secret repository URL lives here.
restic_repository: "s3:https://c583c7c70623bd9136c2c7237b80ff54.r2.cloudflarestorage.com/m1sk9-infra-backup"

# One repository serves every host, so each snapshot carries the host name as both
# its --host and a tag. Targets add their own tag on top (see backup_targets).
restic_host_tag: "{{ inventory_hostname }}"

# Package that provides the sqlite3 CLI, needed only by targets with sqlite_dbs.
restic_sqlite_package: sqlite3

# Units and files left by the s1-only version of this role, removed on every run so
# the timer can never be scheduled from two places at once.
restic_legacy_units:
  - s1-backup.timer
  - s1-backup.service
  - s1-backup-failure.service
restic_legacy_files:
  - /etc/restic/s1-backup.env
  - /usr/local/bin/s1-backup.sh
  - /usr/local/bin/s1-backup-failure.sh

# Retention. Backups run weekly, so keep weeks and months rather than days.
restic_keep_weekly: 5
restic_keep_monthly: 6

# systemd timer schedule (weekly, Friday 03:00).
restic_oncalendar: "Fri *-*-* 03:00:00"

# Backup targets are declared per host in group_vars or host_vars; the role itself is
# data-agnostic. See inventory/group_vars/all/vars.yml for the schema.
backup_targets: []
