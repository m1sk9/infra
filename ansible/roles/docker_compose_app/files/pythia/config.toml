# https://github.com/m1sk9/Pythia/blob/main/config/config.toml

[discord]
## Guilds where Pythia responds. Empty means nowhere.
allowed_guilds = [1390203929182339092]

[llm]
## v3.0.0 supports OpenRouter only.
provider = "openrouter"
## Required. Pythia refuses to start without it (models differ widely in price).
## Free variant while OpenRouter credit purchases fail (2026-10-05); free
## variants are capped per day, so switch back once credits go through.
model = "openai/gpt-6-luna:floor"
## System prompt: either inline or from a file. Setting both is an error.
system_prompt_file = "/config/system_prompt.md"
max_output_tokens = 4096
timeout_secs = 120
## Retries apply to 429 / 5xx / connection errors only.
max_retries = 20

[context]
## Thread messages fetched per turn (Discord allows at most 100 per request).
max_messages = 100
## Character budget for the whole context; newest messages win.
max_chars = 32000

[response]
## Maximum number of 2000-char messages per answer. Excess is cut with a note.
max_parts = 5

[attachments]
## Disabled automatically when the model does not accept images.
images = true
## Images sent per turn, newest first.
max_images = 4
## Only images on this many of the newest user messages are sent.
recent_messages = 5
## Larger images are left out with a note.
max_image_bytes = 5242880

[tools]
## OpenRouter server tools, run by OpenRouter while the model answers.
## Searches and fetches are billed per request on top of tokens.
## Disabled automatically when the model does not support tool calling.
web_search = true
## "auto" (default: the provider's own search, else Exa), "native", "exa",
## "firecrawl" (your Firecrawl credits), "parallel", or "perplexity".
## Prices differ per engine; see OpenRouter's web search docs.
web_search_engine = "parallel"
## Engine-specific, passed through as written. Parallel defaults to "basic"
## ($0.005); "fast" or "turbo" cost $0.001 per search.
web_search_mode = "fast"
## Reads URLs, e.g. ones pasted in the thread.
web_fetch = true
## "auto" (default), "native", "exa", "openrouter" (free), "firecrawl", or "parallel".
web_fetch_engine = "openrouter"
## Current date and time in thread.timezone. No extra cost.
datetime = true

[thread]
## Used in thread names: "{display name} · {YYYY-MM-DD HH:mm}"
timezone = "Asia/Tokyo"

[limits]
## Concurrent generations across all threads.
max_concurrent = 4

[log]
## Same syntax as RUST_LOG; RUST_LOG takes precedence when set.
level = "pythia=info"
## "compact" or "json"
format = "json"
