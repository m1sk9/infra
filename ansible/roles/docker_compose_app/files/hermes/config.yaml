# Hermes Agent on s1. Credentials (OrcaRouter, Discord bot token and allow-list,
# Brave Search) live in the vault-encrypted env file beside this one, handed to
# the container by compose; everything non-secret is here. Env vars win over
# this file, so nothing below is duplicated there.

# OrcaRouter has no built-in provider in Hermes, so it is declared here as a
# named OpenAI-compatible endpoint. key_env keeps the credential in the
# environment rather than inline in this file.
providers:
  orcarouter:
    api: "https://api.orcarouter.ai/v1"
    key_env: "ORCAROUTER_API_KEY"

model:
  provider: "orcarouter"
  default: "deepseek/deepseek-v4-flash-free"
  # Stated by the vendor, not discoverable: OrcaRouter's /v1/models returns a
  # null context_length for the -free variants, so auto-detection has nothing
  # to read and would fall back to a generic window.
  context_length: 1048576

# Allow-list of what the agent may call. `web` is web_search plus web_extract:
# search alone returns titles, URLs and snippets, which is not enough to answer
# "summarise this page" — the agent has to be able to open what it finds.
platform_toolsets:
  discord: [web, discord, memory]
  cli: [web, memory]

agent:
  # Applied after platform_toolsets, so this holds even if a future release
  # changes a platform preset. The bot answers anyone allow-listed in Discord
  # and s1 is a home server: shell, filesystem, and code execution must not be
  # one message away. delegation and cronjob are here for cost and CPU, not
  # safety — both let a single message fan out into many model calls.
  disabled_toolsets:
    - terminal
    - file
    - code_execution
    - browser
    - computer_use
    - delegation
    - cronjob

# Split per capability because no single free backend does both well. Brave is
# search-only, so an extract provider has to sit beside it or web_extract has
# nothing to call.
web:
  # Brave's free tier, 2k queries/month. Not ddgs, which the published image
  # cannot serve: the `ddgs` package is in neither the [all] extra nor
  # tools/lazy_deps.py, so selecting it fails at the first search. brave-free
  # needs only httpx, which is a core dependency.
  search_backend: "brave-free"
  # Tavily's free tier, 1k calls/month, keyed rather than keyless so a missing
  # quota errors instead of silently degrading.
  extract_backend: "tavily"
  # Pin both instead of letting an exhausted quota reroute through the
  # anonymous free-tier ring of five other vendors. Running out should read as
  # running out, not as a slower search.
  keyless_fallback: false
  keyless_rescue: false
  # Above the 15000 default because the usual escape hatch is closed here: an
  # over-budget page is truncated to a head+tail window and the full text left
  # on disk for `read_file` to page through, and `file` is a disabled toolset.
  # Whatever this window does not carry, the agent cannot go back for. The
  # model's context is 1M, so the cost of a wider window is quota, not overflow.
  extract_char_limit: 50000

memory:
  # The agent's own notes: environment facts, conventions, things it worked out.
  # Guild-level knowledge, so one shared store is the right shape.
  memory_enabled: true
  # Off, unlike the default. USER.md holds preferences and communication style,
  # and memory is scoped per profile rather than per Discord user — so with the
  # guild open, one person's "keep answers short" becomes the bot's belief about
  # everyone. The 1375-character budget makes it worse than merely wrong: several
  # speakers thrash it, the agent consolidating one person's entries out to fit
  # another's. Per-user profiles would need an external memory provider, which is
  # far more machinery than this is worth.
  user_profile_enabled: false

# Against the upstream default of "none". Every message re-sends the whole
# session, and the model is a rate-limited free tier, so a session that never
# resets walks itself into HTTP 429. A day of silence is the cheap boundary to
# cut on; the agent flushes what matters to the memory store above before the
# context is dropped, so what it learned survives the reset.
session_reset:
  mode: idle
  idle_minutes: 1440

# Down from the "all" default. auto_thread is off, so progress lines land in
# the channel next to real conversation rather than inside a per-question
# thread; "new" keeps the "it is working" signal and drops the rest. The slash
# command makes the level tunable from Discord, so this is a starting point
# rather than a setting to redeploy over.
display:
  tool_progress: "new"
  tool_progress_command: true

# Chat is open to the whole guild; the command surface is not. Without
# allow_admin_from the gating is disabled entirely and every user can run every
# registered slash command — including /model, which repoints the account at
# any model OrcaRouter offers, paid ones included. Plain conversation is
# unaffected by this block.
gateway:
  platforms:
    discord:
      extra:
        allow_admin_from:
          - "586824421470109716"
        group_allow_admin_from:
          - "586824421470109716"
        # Everyone else gets the always-allowed floor (/help, /whoami) plus
        # these. /reset earns its place: the model's quota is shared, so a user
        # who has bloated their own session should be able to drop it without
        # waiting out the idle timeout.
        user_allowed_commands:
          - reset
          - status
        group_user_allowed_commands:
          - reset
          - status

discord:
  require_mention: true
  # Answer in the channel rather than opening a thread per mention. Threading
  # isolates each exchange, which is the point of the default — but it also
  # means every question leaves a thread behind to collapse or delete, and the
  # sessions this bot holds are per-user already (group_sessions_per_user
  # defaults to true), so the isolation is redundant here.
  auto_thread: false
  reactions: true
