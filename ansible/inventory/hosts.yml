all:
  hosts:
    s1:
      # Tailscale MagicDNS name. Reachable only from within the tailnet.
      ansible_host: dev-m1sk9-s1
      k3s_agent_node_labels:
        - m1sk9.dev/pool=apps
    s2:
      ansible_host: dev-m1sk9-s2
      k3s_node_labels:
        - m1sk9.dev/pool=observability
  children:
    k3s_agents:
      hosts:
        s1:
    k3s_servers:
      hosts:
        s2:
  vars:
    ansible_user: m1sk9
