---
# Non-sensitive shared variables.
# Reference secrets stored in vault.yml via the `vault_` prefix so that
# task files never expose raw secret values.
ansible_become_password: "{{ vault_become_password }}"

# --- s1 backups (restic → Cloudflare R2) ---
# Secret values live in vault.yml under vault_ names.
restic_password: "{{ vault_restic_password }}"
r2_access_key_id: "{{ vault_r2_access_key_id }}"
r2_secret_access_key: "{{ vault_r2_secret_access_key }}"

# Targets consumed by the restic_backup role. Back up more data by adding an
# entry here — the role itself needs no changes. Per target: `name` (used as
# the restic --tag), optional `sqlite_dbs` (online-snapshotted via .backup),
# and optional `paths` (files/dirs handed to restic as-is).
backup_targets: []

# Ping URL for the backup heartbeat, consumed by the restic_backup role. Empty
# disables the pings, so the role stays usable without Better Stack.
backup_heartbeat_url: "{{ vault_heartbeat_url_backup }}"

# --- Better Stack heartbeats (push monitoring) ---
# Targets consumed by the heartbeat role. Nothing outside can poll s1, so each
# entry is a systemd timer that reports outward instead. Per target: `name` (used
# for the unit and file names), `url` (the Better Stack ping endpoint, from the
# vault), `oncalendar` (systemd schedule) and an optional `check_command` run
# before the ping — a non-zero exit reports to <url>/fail with its output.
#
# The periods configured on the Better Stack side tolerate one missed run, so a
# single dropped ping is not an incident.
#
# This is s1's list. The bots run on k3s now, so their checks live on s2, where
# `k3s kubectl` is available — see inventory/host_vars/s2.yml.
heartbeat_targets:
  - name: s1-host
    url: "{{ vault_heartbeat_url_s1_host }}"
    oncalendar: "*:0/2"
    # No check_command: the ping arriving at all is the signal.
