---
# Heartbeats for the bots that run on k3s, pushed from s2 because that is where
# `k3s kubectl` works. The URLs are the same Better Stack heartbeats the Docker
# era used, so nothing changes on the Better Stack side.
#
# Why a Deployment's availableReplicas rather than looking at the node: it goes to
# 0 when the Pod is Pending (s1 down), crash-looping or failing its readiness
# probe, and s2 itself going down stops the pings. All three read as an incident.
#
# chime ships a real liveness check (its Deployment's readiness probe runs
# `chime health`), so for chime this is a functional check. babyrite, honeypot and
# pythia have no health command and hold Discord gateway websockets, so for them
# this only proves the Pod is running — a dead gateway inside a live process stays
# invisible.
heartbeat_targets:
  # Redefined here because host_vars replaces the s1-host list in group_vars
  # rather than merging with it.
  - name: s2-host
    url: "{{ vault_heartbeat_url_s2_host }}"
    oncalendar: "*:0/2"

  - name: chime
    url: "{{ vault_heartbeat_url_chime }}"
    oncalendar: "*:0/3"
    check_command: "test \"$(k3s kubectl -n chime get deployment chime -o jsonpath='{.status.availableReplicas}')\" = 1"

  - name: babyrite
    url: "{{ vault_heartbeat_url_babyrite }}"
    oncalendar: "*:0/3"
    check_command: "test \"$(k3s kubectl -n babyrite get deployment babyrite -o jsonpath='{.status.availableReplicas}')\" = 1"

  - name: honeypot
    url: "{{ vault_heartbeat_url_honeypot }}"
    oncalendar: "*:0/3"
    check_command: "test \"$(k3s kubectl -n honeypot get deployment honeypot -o jsonpath='{.status.availableReplicas}')\" = 1"

  - name: pythia
    url: "{{ vault_heartbeat_url_pythia }}"
    oncalendar: "*:0/3"
    check_command: "test \"$(k3s kubectl -n pythia get deployment pythia -o jsonpath='{.status.availableReplicas}')\" = 1"

# --- Backups ---
# What Git cannot restore: the cluster CA, join token and datastore, and the Sealed
# Secrets keys (without them every SealedSecret in Git is unreadable). Everything
# else on s2 is rebuilt by ArgoCD from Git, and the Prometheus and Loki volumes are
# only metrics and logs that start collecting again.
#
# The keys are exported with a pre_command because they live in the API, not on
# disk; the export lands in the target's scratch directory, which is created 0700.
backup_heartbeat_url: "{{ vault_heartbeat_url_backup_s2 }}"

# Half an hour after s1: both hosts share one repository, and `restic forget --prune`
# takes an exclusive lock that would make the other host's backup fail.
restic_oncalendar: "Fri *-*-* 03:30:00"
backup_targets:
  - name: k3s
    sqlite_dbs:
      - /var/lib/rancher/k3s/server/db/state.db
    paths:
      - /var/lib/rancher/k3s/server/token
      - /var/lib/rancher/k3s/server/tls
      - /etc/rancher/k3s

  - name: sealed-secrets-keys
    pre_commands:
      - 'k3s kubectl -n sealed-secrets get secrets -l sealedsecrets.bitnami.com/sealed-secrets-key -o yaml > "${snap_base}/sealed-secrets-keys/keys.yaml"'
